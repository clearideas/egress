name: CI
on: [push, pull_request]

# Least privilege for the workflow token (review L-7).
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "from importlib.resources import files; import clearideas_egress; assert files('clearideas_egress').joinpath('templates/squid.conf.template').is_file()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*

  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: make unit lint

  e2e:
    # Squid, haproxy and nftables in an unprivileged bubblewrap sandbox with no route out.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Allow unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: make e2e

  image:
    # The production image: E2E suite inside a container built from it (Alpine Squid, installed
    # package, real entrypoint), then a black-box smoke test on a private network.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t clearideas-egress:test .
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id clearideas-egress:test -u)" != "0"
      - name: E2E in the image
        run: EGRESS_IMAGE_PREBUILT=1 tests/docker/e2e.sh
      - name: Smoke test (read-only root, no capabilities, private network)
        run: python3 tests/docker/smoke.py --no-build
