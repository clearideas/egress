[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearideas-egress"
version = "0.1.0"
description = "Generic policy decisions for a Squid egress proxy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clear Ideas" }]
keywords = ["squid", "egress", "proxy", "policy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = []

[project.scripts]
clearideas-egress-acl = "clearideas_egress.cli:main"

[project.urls]
Repository = "https://github.com/clearideas/egress"
Issues = "https://github.com/clearideas/egress/issues"

[tool.setuptools.packages.find]
where = ["src"]
