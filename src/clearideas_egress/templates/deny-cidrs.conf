# Destinations the proxy never connects to, regardless of policy (Squid `dst` ACL).
# Applied only AFTER authentication and a policy allow, so evaluating it never
# triggers DNS lookups for unauthorized names (security review C-1).
#
# Squid normalizes IPv4-mapped IPv6 (::ffff:a.b.c.d) and numeric host forms
# (0xa9fea9fe, 169.254.43518) to IPv4 before matching, so the IPv4 entries cover
# them. Do NOT add ::ffff:0:0/96: Squid stores IPv4 internally as mapped IPv6 and
# that entry would match every IPv4 destination.
#
# IPv4
0.0.0.0/8            # "this network"
10.0.0.0/8           # RFC 1918
100.64.0.0/10        # carrier-grade NAT (includes Alibaba metadata 100.100.100.200)
127.0.0.0/8          # loopback
169.254.0.0/16       # link-local (AWS/GCP/Azure/OCI metadata 169.254.169.254)
172.16.0.0/12        # RFC 1918
192.0.0.0/24         # IETF protocol assignments (includes OCI 192.0.0.192)
192.0.2.0/24         # TEST-NET-1
192.168.0.0/16       # RFC 1918
198.18.0.0/15        # benchmarking
198.51.100.0/24      # TEST-NET-2
203.0.113.0/24       # TEST-NET-3
224.0.0.0/4          # multicast
240.0.0.0/4          # reserved + broadcast
168.63.129.16/32     # Azure WireServer / platform DNS (public address)
# IPv6
::/128               # unspecified
::1/128              # loopback
64:ff9b::/96         # NAT64 well-known prefix (reaches IPv4, including metadata)
64:ff9b:1::/48       # local-use NAT64
100::/64             # discard-only
2001::/32            # Teredo (embeds IPv4)
2001:db8::/32        # documentation
2002::/16            # 6to4 (embeds IPv4)
fc00::/7             # unique local (includes AWS fd00:ec2::254)
fe80::/10            # link-local
fec0::/10            # deprecated site-local
ff00::/8             # multicast
